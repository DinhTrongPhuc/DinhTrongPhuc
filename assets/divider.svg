<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 44" role="img" aria-label="animated divider">
  <defs>
    <linearGradient id="streakA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FE428E"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="streakB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#FE428E"/>
    </linearGradient>
  </defs>

  <rect x="0" y="20" width="1000" height="3" rx="1.5" fill="#FE428E" opacity="0.18"/>

  <rect x="-260" y="17" width="260" height="9" rx="4.5" fill="url(#streakA)">
    <animate attributeName="x" values="-260;1000" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <rect x="-260" y="20" width="260" height="3" rx="1.5" fill="url(#streakB)">
    <animate attributeName="x" values="1000;-260" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
