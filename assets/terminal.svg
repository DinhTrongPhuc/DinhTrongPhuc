<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 700 300" role="img" aria-label="animated terminal">
  <defs>
    <clipPath id="l1"><rect x="26" y="66" width="648" height="22"><animate attributeName="width" from="0" to="648" dur="0.7s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="26" y="88" width="648" height="22"><animate attributeName="width" from="0" to="648" dur="0.7s" begin="1.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="26" y="110" width="648" height="22"><animate attributeName="width" from="0" to="648" dur="0.7s" begin="1.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="26" y="132" width="648" height="22"><animate attributeName="width" from="0" to="648" dur="0.7s" begin="2.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="26" y="154" width="648" height="22"><animate attributeName="width" from="0" to="648" dur="0.7s" begin="3.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="26" y="176" width="648" height="22"><animate attributeName="width" from="0" to="648" dur="0.7s" begin="4.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="l7"><rect x="26" y="198" width="648" height="22"><animate attributeName="width" from="0" to="648" dur="0.7s" begin="4.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="cursor"><rect x="26" y="220" width="648" height="22"><animate attributeName="width" from="0" to="14" dur="0.05s" begin="5.5s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="6" y="6" width="688" height="288" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <path d="M18 6 h664 a12 12 0 0 1 12 12 v30 h-688 v-30 a12 12 0 0 1 12 -12 z" fill="#161b22"/>
  <line x1="6" y1="48" x2="694" y2="48" stroke="#30363d" stroke-width="1.5"/>

  <circle cx="30" cy="27" r="5.5" fill="#ff5f57"/>
  <circle cx="48" cy="27" r="5.5" fill="#febc2e"/>
  <circle cx="66" cy="27" r="5.5" fill="#28c840"/>
  <text x="92" y="32" font-family="monospace" font-size="13" fill="#8b949e">~/dinh-trong-phuc — zsh</text>
  <circle cx="655" cy="27" r="5" fill="#28c840">
    <animate attributeName="opacity" values="1;0.15;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <g font-family="monospace" font-size="14" fill="#c9d1d9">
    <g clip-path="url(#l1)">
      <text x="30" y="82" fill="#7ee787">$</text>
      <text x="46" y="82" fill="#79c0ff">whoami</text>
    </g>
    <g clip-path="url(#l2)">
      <text x="46" y="104" fill="#e6edf3">Dinh Trong Phuc</text>
    </g>
    <g clip-path="url(#l3)">
      <text x="46" y="126" fill="#8b949e">Junior Backend Developer &amp; Operating/Software Engineer</text>
    </g>
    <g clip-path="url(#l4)">
      <text x="30" y="148" fill="#7ee787">$</text>
      <text x="46" y="148" fill="#79c0ff">docker compose up -d</text>
    </g>
    <g clip-path="url(#l5)">
      <text x="46" y="170" fill="#7ee787">api</text>
      <text x="86" y="170" fill="#c9d1d9">✔ running</text>
      <text x="200" y="170" fill="#7ee787">db</text>
      <text x="240" y="170" fill="#c9d1d9">✔ running</text>
    </g>
    <g clip-path="url(#l6)">
      <text x="30" y="192" fill="#7ee787">$</text>
      <text x="46" y="192" fill="#79c0ff">kubectl get pods</text>
    </g>
    <g clip-path="url(#l7)">
      <text x="46" y="214" fill="#c9d1d9">api-7f9c  Running</text>
      <text x="230" y="214" fill="#c9d1d9">db-4b21  Running</text>
    </g>
    <g clip-path="url(#cursor)">
      <rect x="46" y="222" width="9" height="16" fill="#c9d1d9">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
